[project]
name = "proxystudy"
version = "0.1.0"
description = "Proxy-guided sampling under demographic uncertainty: statistical reliability and fairness study"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
vision = ["torch>=2.4", "torchvision>=0.19"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxystudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
